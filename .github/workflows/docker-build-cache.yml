permissions:
  contents: read
  packages: write

name: Docker Build Cache

on:
  push:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "integrations/**"

jobs:
  build-main-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout IntelOwl
        uses: actions/checkout@v6.0.2

      - name: Set image repo
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bake images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker/docker-bake.ci.hcl
          load: false
          push: false
          set: |
            uwsgi.cache-to=type=registry,ref=${{ env.IMAGE_REPO }}:cache-main,mode=max
            nginx.cache-to=type=registry,ref=${{ env.IMAGE_REPO }}:cache-nginx,mode=max
        env:
          CACHE_REPO: ${{ env.IMAGE_REPO }}
