version: "3.9"

services:
  uwsgi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REPO_DOWNLOADER_ENABLED: ${REPO_DOWNLOADER_ENABLED:-0}
        PYCTI_VERSION: ${PYCTI_VERSION:-""}
    image: intelowlproject/intelowl:ci
    env_file:
      - ./docker/env_file_app_ci
    depends_on:
      - celery_worker_default
      - celery_beat

  daphne:
    image: intelowlproject/intelowl:ci
    env_file:
      - ./docker/env_file_app_ci

  celery_beat:
    image: intelowlproject/intelowl:ci
    env_file:
      - ./docker/env_file_app_ci

  celery_worker_default:
    image: intelowlproject/intelowl:ci
    env_file:
      - ./docker/env_file_app_ci

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile_nginx
    image: intelowlproject/intelowl_nginx:ci
    ports:
      - "80:80"