services:
  uwsgi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REPO_DOWNLOADER_ENABLED: ${REPO_DOWNLOADER_ENABLED}
        PYCTI_VERSION: ${PYCTI_VERSION:-5.10.0}
      target: development
    image: intelowlproject/intelowl:test
    volumes:
      - ../:/opt/deploy/intel_owl
    command: python manage.py runserver 0.0.0.0:8001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001 || exit 1"]
      interval: 10s
      timeout: 2s
      start_period: 30s
      retries: 10
      start_interval: 1s
    environment:
      - DEBUG=True
      - DJANGO_TEST_SERVER=True

  daphne:
    image: intelowlproject/intelowl:test
    volumes:
      - ../:/opt/deploy/intel_owl

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile_nginx
    image: intelowlproject/intelowl_nginx:test
    volumes:
      - ../configuration/nginx/django_server.conf:/etc/nginx/conf.d/default.conf

  celery_beat:
    image: intelowlproject/intelowl:test
    volumes:
      - ../:/opt/deploy/intel_owl
    environment:
      - DEBUG=True

  celery_worker_default:
    image: intelowlproject/intelowl:test
    volumes:
      - ../:/opt/deploy/intel_owl
    environment:
      - DEBUG=True
