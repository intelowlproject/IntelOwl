apiVersion: v2
name: intelowl
description: A Helm chart for deploying IntelOwl - Open Source Intelligence Platform
type: application
version: 1.0.0
appVersion: "v6.5.0"

keywords:
  - intelowl
  - threat-intelligence
  - osint
  - malware-analysis
  - security

home: https://github.com/intelowlproject/IntelOwl

sources:
  - https://github.com/intelowlproject/IntelOwl

maintainers:
  - name: IntelOwl Project
    url: https://github.com/intelowlproject
  - name: Maxime Wewer
    url: https://github.com/MaximeWewer

icon: https://raw.githubusercontent.com/intelowlproject/IntelOwl/master/docs/static/intel_owl_negative.png

kubeVersion: ">=1.25.0-0"

dependencies:
  # CloudNative-PG Operator
  - name: cloudnative-pg
    version: "0.27.*"
    repository: "https://cloudnative-pg.github.io/charts"
    condition: postgresql.operator.enabled
    alias: cnpg

  # OT-CONTAINER-KIT Redis Operator
  - name: redis-operator
    version: "0.23.*"
    repository: "https://ot-container-kit.github.io/helm-charts/"
    condition: redis.operator.enabled
    alias: redis-operator

  # Bitnami RabbitMQ Cluster Operator
  - name: rabbitmq-cluster-operator
    version: "4.4.*"
    repository: "oci://registry-1.docker.io/bitnamicharts"
    condition: rabbitmq.operator.enabled
    alias: rabbitmq-operator

annotations:
  artifacthub.io/license: AGPL-3.0

  kubernetes.io/minimum-version: "1.25.0"

  category: "Security"

  artifacthub.io/screenshots: |
    - title: Scan page
      url: https://intelowlproject.github.io/docs/IntelOwl/static/pivot_scan_page.png
    - title: Pivot investigation
      url: https://intelowlproject.github.io/docs/IntelOwl/static/pivot_investigation.png
    - title: Complexe investigation
      url: https://intelowlproject.github.io/docs/IntelOwl/static/pivot_investigation.png

  artifacthub.io/links: |
    - name: Documentation
      url: https://intelowl.readthedocs.io/
    - name: Source
      url: https://github.com/intelowlproject/IntelOwl
