# IntelOwl with RabbitMQ as message broker (instead of Redis)
# Use this if you prefer RabbitMQ for Celery task queues
#
# Prerequisites:
# - CloudNative-PG operator installed
# - redis-operator installed (or set redis.operator.enabled=true)
# - rabbitmq-cluster-operator installed (or set rabbitmq.operator.enabled=true):
#     helm install rabbitmq-operator oci://registry-1.docker.io/bitnamicharts/rabbitmq-cluster-operator -n rabbitmq-system --create-namespace
# - Gateway API CRDs installed
#
# Install (from helm directory):
#   cd helm
#   helm install intelowl . -f examples/with-rabbitmq.yaml -n intelowl --create-namespace

app:
  version: "v6.5.0"
  django:
    secretKey: "your-secret-key-change-me"
    debug: false

# Standard service configuration
uwsgi:
  replicaCount: 2

daphne:
  enabled: true
  replicaCount: 2

nginx:
  replicaCount: 2

celeryWorkerDefault:
  replicaCount: 2
  concurrency: 4

# Database
postgresql:
  enabled: true
  instances: 1
  storage:
    size: "10Gi"

# Message broker configuration
broker:
  # Use RabbitMQ instead of Redis
  type: "rabbitmq"

  # Disable internal Redis (still need it for caching/websockets)
  redis:
    internal: true # Redis is still used for result backend and websockets

  # Use internal RabbitMQ
  rabbitmq:
    internal: true

# Redis (still needed for result backend and websockets, via redis-operator)
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
  storage:
    size: "5Gi"

# RabbitMQ configuration (via rabbitmq-cluster-operator CRD)
rabbitmq:
  enabled: true
  replicas: 1
  image: rabbitmq:4.1.3-management
  persistence:
    size: "5Gi"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# Storage
storage:
  genericLogs:
    size: "10Gi"
  sharedFiles:
    size: "20Gi"
  staticContent:
    size: "5Gi"

# Gateway API networking
networking:
  type: "gateway"
  gateway:
    create: true
    gatewayClass:
      name: "nginx"
    httpRoute:
      hostnames:
        - "intelowl.local"
